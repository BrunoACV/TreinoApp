plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    aaptOptions {
        noCompress "gif"
    }
    namespace 'br.com.treinofit'
    compileSdk 36

    defaultConfig {
        applicationId "br.com.treinofit"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig true
    }

    // Senhas da chave fora do git (o repositorio e publico): android/keystore.properties, ignorado.
    def chave = new Properties()
    def arqChave = rootProject.file("keystore.properties")
    if (arqChave.exists()) arqChave.withInputStream { chave.load(it) }
    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword chave.getProperty("storePassword", "")
            keyAlias chave.getProperty("keyAlias", "release")
            keyPassword chave.getProperty("keyPassword", "")
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
